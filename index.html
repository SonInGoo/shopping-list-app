<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #1f2937;
      --muted: #9ca3af;
      --border: #e5e7eb;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .input-row button {
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .input-row button:hover { background: var(--primary-hover); }

    ul.list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li.item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: background 0.15s;
    }

    li.item:hover { background: #fafafa; }

    li.item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    li.item .name {
      flex: 1;
      font-size: 15px;
      word-break: break-all;
    }

    li.item.done .name {
      text-decoration: line-through;
      color: var(--muted);
    }

    li.item .delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    li.item .delete:hover {
      color: var(--danger);
      background: #fef2f2;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 32px 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer button {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
    }

    .footer button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p>필요한 물건을 추가하고 체크하세요</p>
    </header>

    <div class="card">
      <form class="input-row" id="addForm">
        <input
          type="text"
          id="itemInput"
          placeholder="예: 우유, 계란, 빵..."
          autocomplete="off"
          maxlength="100"
        />
        <button type="submit">추가</button>
      </form>

      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">불러오는 중…</div>

      <div class="footer">
        <span id="counter"></span>
        <button id="clearDone" type="button">완료 항목 비우기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Supabase 연결 정보 (anon/publishable 키는 클라이언트 노출용이며 RLS로 보호됩니다)
    const SUPABASE_URL = "https://lrrupqysmdwrlvovddka.supabase.co";
    const SUPABASE_KEY = "sb_publishable_78Ex-XusXKXMnd8kWxA3-w_wlXSyCag";
    const TABLE = "shopping_items";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("addForm");
    const input = document.getElementById("itemInput");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const counterEl = document.getElementById("counter");
    const clearDoneBtn = document.getElementById("clearDone");

    let items = [];

    async function loadItems() {
      const { data, error } = await supabase
        .from(TABLE)
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        showError("목록을 불러오지 못했습니다: " + error.message);
        return;
      }
      items = data;
      render();
    }

    async function addItem(name) {
      const trimmed = name.trim();
      if (!trimmed) return;

      const { data, error } = await supabase
        .from(TABLE)
        .insert({ text: trimmed })
        .select()
        .single();

      if (error) {
        showError("추가하지 못했습니다: " + error.message);
        return;
      }
      items.push(data);
      render();
    }

    async function deleteItem(id) {
      const prev = items;
      items = items.filter((item) => item.id !== id);
      render();

      const { error } = await supabase.from(TABLE).delete().eq("id", id);
      if (error) {
        items = prev; // 실패 시 롤백
        render();
        showError("삭제하지 못했습니다: " + error.message);
      }
    }

    async function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;

      const nextDone = !item.done;
      item.done = nextDone; // 낙관적 업데이트
      render();

      const { error } = await supabase
        .from(TABLE)
        .update({ done: nextDone })
        .eq("id", id);

      if (error) {
        item.done = !nextDone; // 실패 시 롤백
        render();
        showError("상태 변경에 실패했습니다: " + error.message);
      }
    }

    async function clearDone() {
      const doneItems = items.filter((i) => i.done);
      if (doneItems.length === 0) return;

      const prev = items;
      items = items.filter((i) => !i.done);
      render();

      const { error } = await supabase.from(TABLE).delete().eq("done", true);
      if (error) {
        items = prev; // 실패 시 롤백
        render();
        showError("완료 항목 삭제에 실패했습니다: " + error.message);
      }
    }

    function showError(message) {
      emptyEl.style.display = "block";
      emptyEl.textContent = message;
    }

    function render() {
      listEl.innerHTML = "";

      if (items.length === 0) {
        emptyEl.style.display = "block";
        emptyEl.textContent = "아직 항목이 없습니다. 첫 항목을 추가해 보세요!";
      } else {
        emptyEl.style.display = "none";
      }

      items.forEach((item) => {
        const li = document.createElement("li");
        li.className = "item" + (item.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "✕";
        del.title = "삭제";
        del.addEventListener("click", () => deleteItem(item.id));

        li.append(checkbox, name, del);
        listEl.appendChild(li);
      });

      const remaining = items.filter((i) => !i.done).length;
      counterEl.textContent = items.length
        ? `남은 항목 ${remaining}개 / 전체 ${items.length}개`
        : "";
    }

    // 기존 localStorage 데이터를 Supabase로 1회 이관
    async function migrateLocalStorage() {
      const LEGACY_KEY = "shopping-list-items";
      const MIGRATED_FLAG = "shopping-list-migrated";
      if (localStorage.getItem(MIGRATED_FLAG)) return;

      let legacy = [];
      try {
        legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || [];
      } catch {
        legacy = [];
      }

      if (legacy.length > 0) {
        const rows = legacy
          .filter((i) => i && i.name)
          .map((i) => ({ text: i.name, done: !!i.done }));
        if (rows.length > 0) {
          const { error } = await supabase.from(TABLE).insert(rows);
          if (error) {
            console.warn("localStorage 이관 실패:", error.message);
            return; // 플래그를 세우지 않아 다음에 재시도
          }
        }
      }
      localStorage.setItem(MIGRATED_FLAG, "1");
      localStorage.removeItem(LEGACY_KEY);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = input.value;
      input.value = "";
      input.focus();
      await addItem(value);
    });

    clearDoneBtn.addEventListener("click", clearDone);

    // 시작: 이관 후 목록 로드
    await migrateLocalStorage();
    await loadItems();
  </script>
</body>
</html>
